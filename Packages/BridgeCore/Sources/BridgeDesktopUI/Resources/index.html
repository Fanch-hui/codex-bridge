  <body>
    <section id="startup-screen" class="startup-screen" aria-label="启动 Codex Bridge" aria-busy="true">
      <div class="startup-content">
        <div class="startup-mark" aria-hidden="true"><img src="startup-icon.png" width="88" height="88" alt=""></div>
        <p id="startup-status" class="startup-status" role="status" aria-live="polite">正在打开工作台…</p>
        <div id="startup-actions" class="startup-actions" hidden>
          <button id="startup-retry" class="button" type="button" hidden>重试</button>
          <button id="startup-enter" class="button secondary" type="button">进入应用</button>
        </div>
      </div>
    </section>
    <div class="app-shell" id="app-shell" data-state="loading">
      <aside class="sidebar" id="main-sidebar" aria-label="主导航">
        <div class="sidebar-topbar">
          <button class="sidebar-toggle icon-button" type="button" aria-label="收起侧边栏" aria-expanded="true" aria-controls="main-sidebar" data-action="toggle-sidebar">
            <span class="icon" data-symbol="sidebar.left"></span>
          </button>
        </div>
        <div class="sidebar-primary-action">
          <button class="new-conversation-button" type="button" data-action="new-conversation" title="新建对话" aria-label="新建对话" disabled>
            <span class="icon" data-symbol="plus"></span><span class="new-conversation-label">新建对话</span>
          </button>
        </div>
        <nav class="navigation" id="navigation" aria-label="页面导航"></nav>
        <div class="workspace-navigator" id="workspace-navigator" hidden></div>
        <nav class="navigation navigation-secondary" id="secondary-navigation" aria-label="应用设置"></nav>
        <div class="sidebar-footer">
          <span class="connection-indicator" id="connection-indicator" role="img" aria-label="等待连接状态"></span>
          <span id="connection-label">等待连接状态</span>
          <span class="refresh-indicator" id="refresh-indicator" aria-hidden="true"></span>
        </div>
        <div class="sidebar-divider" role="separator" aria-label="调整侧边栏宽度" aria-orientation="vertical"
          aria-controls="main-sidebar" aria-valuemin="220" aria-valuemax="340" aria-valuenow="252" tabindex="0"></div>
      </aside>

      <main class="main-shell">
        <header class="toolbar">
          <h1 id="page-title">工作台</h1>
          <div class="workspace-toolbar-context" id="workspace-toolbar-context" hidden></div>
          <div class="workspace-toolbar-actions" id="workspace-toolbar-actions" hidden></div>
          <button class="refresh-button icon-button" type="button" aria-label="刷新状态" title="刷新当前页面" data-action="refresh">
            <span class="icon" data-symbol="arrow.clockwise"></span>
          </button>
        </header>

        <div class="content-scroll">
          <section class="overview-page" id="overview-page" aria-labelledby="page-title">
            <div id="overview-content"></div>
          </section>

          <section class="workbench-page" id="workbench-page" hidden aria-label="工作台">
            <div id="workbench-mode-bar" class="workbench-mode-bar" hidden></div>
            <div class="workbench-layout" id="collaboration-workbench">
              <section class="browser-pane" id="workbench-browser-pane" aria-label="内置 ChatGPT 浏览器">
                <div class="browser-toolbar" id="workbench-browser-toolbar"></div>
                <div id="chat-browser-slot">
                  <div class="browser-slot-note" id="browser-slot-note">正在加载聊天网页…</div>
                </div>
              </section>
              <div class="workbench-divider" id="workbench-divider" role="separator"
                aria-label="调整网页与 Agent 展示区域宽度" aria-orientation="vertical"
                aria-controls="workbench-browser-pane workbench-inspector-pane" tabindex="0"></div>
              <aside class="inspector-pane" id="workbench-inspector-pane" aria-label="任务检查器">
                <div class="inspector-header" id="workbench-inspector-header"></div>
                <div class="inspector-approvals" id="workbench-inspector-approvals"></div>
                <div class="workbench-conversation-viewport">
                  <div class="inspector-content" id="workbench-inspector-content"></div>
                  <div class="workbench-edge-blur" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
                  <div class="workbench-edge-blur is-bottom" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
                </div>
                <div class="inspector-native-sessions" id="workbench-native-sessions" hidden></div>
                <div class="inspector-footer" id="workbench-inspector-footer"></div>
              </aside>
            </div>
          </section>

          <section class="page" id="projects-page" hidden aria-labelledby="page-title">
            <div id="projects-content"></div>
          </section>

          <section class="page" id="logs-page" hidden aria-labelledby="page-title">
            <div id="logs-content"></div>
          </section>

          <section class="page" id="connections-page" hidden aria-labelledby="page-title">
            <div id="connections-content"></div>
          </section>

          <section class="page" id="settings-page" hidden aria-labelledby="page-title">
            <div id="settings-content"></div>
          </section>

          <div class="loading-state" id="loading-state" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>正在读取后台服务状态…</span>
          </div>
        </div>
      </main>
    </div>
    <div class="feedback-layer" id="feedback-layer" hidden></div>
