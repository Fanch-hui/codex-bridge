<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
    <title>Codex Bridge</title>
    <script src="host-context.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="markdown.css">
    <link rel="stylesheet" href="workbench.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="windows-theme.css">
    <link rel="stylesheet" href="windows-components.css">
  </head>
  <body>
    <div class="app-shell" id="app-shell" data-state="loading">
      <aside class="sidebar" id="main-sidebar" aria-label="主导航">
        <div class="sidebar-topbar">
          <button class="sidebar-toggle icon-button" type="button" aria-label="收起侧边栏" aria-expanded="true" aria-controls="main-sidebar" data-action="toggle-sidebar">
            <span class="icon" data-symbol="sidebar.left"></span>
          </button>
        </div>
        <nav class="navigation" id="navigation" aria-label="页面导航"></nav>
        <div class="sidebar-footer">
          <span class="connection-indicator" id="connection-indicator" aria-hidden="true"></span>
          <span id="connection-label">等待连接状态</span>
          <span class="refresh-indicator" id="refresh-indicator" aria-hidden="true"></span>
        </div>
      </aside>

      <main class="main-shell">
        <header class="toolbar">
          <h1 id="page-title">概览</h1>
          <button class="refresh-button icon-button" type="button" aria-label="刷新状态" data-action="refresh">
            <span class="icon" data-symbol="arrow.clockwise"></span>
          </button>
        </header>

        <div class="content-scroll">
          <section class="overview-page" id="overview-page" aria-labelledby="overview-title">
            <div class="section-header">
              <span class="section-icon icon-tile" data-symbol="gauge.with.needle" aria-hidden="true"></span>
              <div>
                <h2 id="overview-title">概览</h2>
                <p id="overview-subtitle"></p>
              </div>
            </div>

            <div class="notice-stack" id="notices" aria-live="polite"></div>

            <section class="content-section" aria-labelledby="metrics-title">
              <h3 id="metrics-title">关键指标</h3>
              <div class="metrics-grid" id="metrics"></div>
            </section>

            <section class="content-section" aria-labelledby="services-title">
              <h3 id="services-title">连接与服务拓扑全景</h3>
              <div class="surface-card service-card" id="services"></div>
            </section>

            <section class="content-section recent-section" id="recent-section" aria-labelledby="recent-title">
              <div class="section-heading-row">
                <h3 id="recent-title">最近任务</h3>
                <button class="link-button" type="button" data-action="select-page" data-page="workbench">进入工作台 <span aria-hidden="true">→</span></button>
              </div>
              <div class="surface-card recent-card" id="recent-tasks"></div>
            </section>
          </section>

          <section class="workbench-page" id="workbench-page" hidden aria-label="工作台">
            <div class="workbench-layout">
              <section class="browser-pane" id="workbench-browser-pane" aria-label="内置 ChatGPT 浏览器">
                <div class="browser-toolbar" id="workbench-browser-toolbar"></div>
                <div id="chat-browser-slot">
                  <div class="browser-slot-note" id="browser-slot-note">由宿主加载真实 ChatGPT 工作区</div>
                </div>
              </section>
              <aside class="inspector-pane" id="workbench-inspector-pane" aria-label="任务检查器">
                <div class="inspector-header" id="workbench-inspector-header"></div>
                <div class="inspector-approvals" id="workbench-inspector-approvals"></div>
                <div class="inspector-content" id="workbench-inspector-content"></div>
                <div class="inspector-footer" id="workbench-inspector-footer"></div>
              </aside>
            </div>
          </section>

          <section class="page" id="projects-page" hidden aria-labelledby="projects-title">
            <div id="projects-content"></div>
          </section>

          <section class="page" id="logs-page" hidden aria-labelledby="logs-title">
            <div id="logs-content"></div>
          </section>

          <section class="page" id="connections-page" hidden aria-labelledby="connections-title">
            <div id="connections-content"></div>
          </section>

          <section class="page" id="settings-page" hidden aria-labelledby="settings-title">
            <div id="settings-content"></div>
          </section>

          <div class="loading-state" id="loading-state" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>正在读取本机 Service 状态…</span>
          </div>
        </div>
      </main>
    </div>
    <div class="feedback-layer" id="feedback-layer" hidden></div>
    <script src="pages-common.js"></script>
    <script src="pages-native-permissions.js"></script>
    <script src="pages-workbench-controls.js"></script>
    <script src="pages-workbench-conversation.js"></script>
    <script src="pages-workbench-header.js"></script>
    <script src="pages-workbench.js"></script>
    <script src="pages-form-draft.js"></script>
    <script src="pages-agent-connector-details.js"></script>
    <script src="pages-agent-headless-consent.js"></script>
    <script src="pages-agent-connector-row.js"></script>
    <script src="pages-agent-connectors.js"></script>
    <script src="pages-codex-connection.js"></script>
    <script src="pages-connections-editor.js"></script>
    <script src="pages-project-editors.js"></script>
    <script src="pages-project-collections.js"></script>
    <script src="pages-projects.js"></script>
    <script src="pages-logs.js"></script>
    <script src="pages-connections.js"></script>
    <script src="pages-settings-native.js"></script>
    <script src="pages-settings-models.js"></script>
    <script src="pages-settings-agents.js"></script>
    <script src="pages-settings-instructions.js"></script>
    <script src="pages-direct.js"></script>
    <script src="pages-settings.js"></script>
    <script src="pages.js"></script>
    <script src="feedback.js"></script>
    <script src="sidebar.js"></script>
    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
