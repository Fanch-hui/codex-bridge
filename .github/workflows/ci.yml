name: macOS
on:
  push:
    branches: [win]
  pull_request:
    branches: [win]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Apple Silicon app
        run: >-
          Scripts/with-xcode.sh xcodebuild -project CodexBridge.xcodeproj
          -scheme CodexBridge -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath .build/Xcode
          build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          REQUIRE_TUNNEL_HELPER=NO
