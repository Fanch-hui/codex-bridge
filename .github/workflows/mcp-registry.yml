name: Publish MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published App release tag containing the MCPB asset
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify release package and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-package"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "codex-bridge-${RELEASE_TAG#v}.mcpb" --pattern server.json \
            --dir "$RUNNER_TEMP/mcp-package"
          node Scripts/verify-mcpb-release.mjs \
            "$RUNNER_TEMP/mcp-package/codex-bridge-${RELEASE_TAG#v}.mcpb" \
            "$RUNNER_TEMP/mcp-package/server.json" "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Install official publisher
        working-directory: ${{ runner.temp }}
        run: |
          release='https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1'
          curl --fail --location --retry 3 "$release/mcp-publisher_linux_amd64.tar.gz" -o publisher.tar.gz
          curl --fail --location --retry 3 "$release/registry_1.8.1_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "mcp-publisher_linux_amd64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  publisher.tar.gz\n' "$expected" | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate Registry metadata
        working-directory: ${{ runner.temp }}/mcp-package
        run: mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        working-directory: ${{ runner.temp }}/mcp-package
        run: mcp-publisher login github-oidc

      - name: Publish to the official MCP Registry
        working-directory: ${{ runner.temp }}/mcp-package
        run: mcp-publisher publish

      - name: Verify Registry entry
        working-directory: ${{ runner.temp }}/mcp-package
        run: |
          registry_name="$(jq -r .name server.json)"
          encoded_name="$(jq -rn --arg name "$registry_name" '$name | @uri')"
          curl --fail --silent --show-error --retry 3 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/$(jq -r .version server.json)" \
            -o "$RUNNER_TEMP/registry-result.json"
          jq --exit-status --arg name "$registry_name" --arg version "$(jq -r .version server.json)" \
            '.server.name == $name and .server.version == $version' \
            "$RUNNER_TEMP/registry-result.json"
