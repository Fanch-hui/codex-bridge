name: Publish MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published App release tag containing the MCPB asset
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release package and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/codex-bridge-${server.version}.mcpb`;
          if (`v${server.version}` !== process.env.RELEASE_TAG ||
              server.name !== `io.github.${process.env.GITHUB_REPOSITORY}` ||
              server.packages.length !== 1 ||
              server.packages[0].identifier !== expected) {
            throw new Error('Registry metadata must match this repository and release');
          }
          NODE
          mkdir -p "$RUNNER_TEMP/mcp-package"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "codex-bridge-$(jq -r .version server.json).mcpb" --dir "$RUNNER_TEMP/mcp-package"
          printf '%s  %s\n' "$(jq -r '.packages[0].fileSha256' server.json)" \
            "$RUNNER_TEMP/mcp-package/codex-bridge-$(jq -r .version server.json).mcpb" | sha256sum --check

      - name: Install official publisher
        working-directory: ${{ runner.temp }}
        run: |
          release='https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1'
          curl --fail --location --retry 3 "$release/mcp-publisher_linux_amd64.tar.gz" -o publisher.tar.gz
          curl --fail --location --retry 3 "$release/registry_1.8.1_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "mcp-publisher_linux_amd64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  publisher.tar.gz\n' "$expected" | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate Registry metadata
        run: mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish to the official MCP Registry
        run: mcp-publisher publish

      - name: Verify Registry entry
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.yeyuancc0-glitch%2Fcodex-bridge/versions/$(jq -r .version server.json)" \
            -o "$RUNNER_TEMP/registry-result.json"
          jq --exit-status --arg version "$(jq -r .version server.json)" \
            '.server.name == "io.github.yeyuancc0-glitch/codex-bridge" and .server.version == $version' \
            "$RUNNER_TEMP/registry-result.json"
