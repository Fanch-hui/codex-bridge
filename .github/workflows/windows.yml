name: windows

on:
  push:
    branches: [win, 'codex/platform-*']
  pull_request:
    branches: [win]
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture
        type: choice
        options: [all, x64, arm64]
        default: all
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      SWIFT_VERSION: 6.3.3
      TARGET_TRIPLE: ${{ matrix.architecture == 'arm64' && 'aarch64-unknown-windows-msvc' || 'x86_64-unknown-windows-msvc' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exclude build directories from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE "Packages")
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE ".build")
          Add-MpPreference -ExclusionProcess "swift-frontend.exe"
          Add-MpPreference -ExclusionProcess "swift.exe"
          Add-MpPreference -ExclusionProcess "clang.exe"
          Add-MpPreference -ExclusionProcess "lld-link.exe"
      - name: Restore Swift installer cache
        id: swift-installer-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/swift-downloads
          key: windows-swift-installer-v2-${{ env.SWIFT_VERSION }}-${{ runner.arch }}
      - name: Install Swift toolchain
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-windows-swift.ps1" -Version $env:SWIFT_VERSION'
      - name: Save Swift installer cache
        if: steps.swift-installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/swift-downloads
          key: ${{ steps.swift-installer-cache.outputs.cache-primary-key }}
      - name: Prepare WiX runtime extraction tools
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-windows-wix.ps1"'
      - name: Validate Swift portable runtime
        shell: pwsh
        run: |
          $scriptRoot = Join-Path $env:GITHUB_WORKSPACE "Scripts"
          . (Join-Path $scriptRoot "windows-portable-support.ps1")
          . (Join-Path $scriptRoot "windows-portable-runtime.ps1")
          $architecture = "${{ matrix.architecture }}"
          $expectedMachine = if ($architecture -eq "x64") { [UInt16]0x8664 } else { [UInt16]0xAA64 }
          $temporaryRoot = Join-Path $env:RUNNER_TEMP ("swift-runtime-" + [Guid]::NewGuid().ToString("N"))
          try {
            $modulePath = Resolve-SwiftRuntimeMergeModule $architecture
            Expand-SwiftRuntimeMergeModule $modulePath $temporaryRoot
            $swiftCore = @(Get-ChildItem -LiteralPath $temporaryRoot -File -Recurse -Filter "swiftCore.dll")
            if ($swiftCore.Count -ne 1 -or (Get-PEMachine $swiftCore[0].FullName) -ne $expectedMachine) {
              throw "Swift runtime merge module did not contain the expected swiftCore.dll."
            }
            Write-Host "Validated $modulePath"
          } finally {
            if (Test-Path -LiteralPath $temporaryRoot) {
              Remove-Item -LiteralPath $temporaryRoot -Recurse -Force
            }
          }
      - name: Identify vcpkg cache
        id: vcpkg-cache-key
        shell: pwsh
        run: |
          $revision = & git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_OUTPUT "revision=$revision"
          Add-Content $env:GITHUB_OUTPUT "image=$env:ImageVersion"
          $cachePath = Join-Path $env:GITHUB_WORKSPACE ".build\ci-cache\vcpkg"
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite"
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/ci-cache/vcpkg
          key: windows-vcpkg-v1-${{ matrix.architecture }}-windows-${{ steps.vcpkg-cache-key.outputs.image }}-${{ steps.vcpkg-cache-key.outputs.revision }}
      - name: Install SQLite via vcpkg (for GRDB)
        shell: pwsh
        run: |
          $triplet = "${{ matrix.architecture }}-windows"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "sqlite3:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archDir = "${{ matrix.architecture }}"
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath | Select-Object -First 1
          . "$env:GITHUB_WORKSPACE\Scripts\windows-build-environment.ps1"
          $buildEnvironment = Get-WindowsBuildEnvironment -Architecture $archDir
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet"
          $vcpkgBin = Join-Path $vcpkgRoot "bin"
          $includePaths = @((Join-Path $vcpkgRoot "include")) + $buildEnvironment.IncludePaths
          Add-Content $env:GITHUB_ENV "INCLUDE=$($includePaths -join ';')"
          $targetLibraryPaths = (@((Join-Path $vcpkgRoot "lib")) + $buildEnvironment.LibraryPaths) -join ";"
          Add-Content $env:GITHUB_ENV "TARGET_LIBRARY_PATHS=$targetLibraryPaths"
          . "$env:GITHUB_WORKSPACE\Scripts\windows-portable-support.ps1"
          $expectedMachine = if ($archDir -eq "arm64") { [UInt16]0xAA64 } else { [UInt16]0x8664 }
          if ((Get-PEMachine (Join-Path $vcpkgBin "sqlite3.dll")) -ne $expectedMachine) {
            throw "SQLite runtime architecture does not match $archDir."
          }
          $vcRedistRoot = Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match "^[0-9]+(?:\.[0-9]+)+$" } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $vcRedistRoot) { throw "Visual C++ Redistributable files are unavailable." }
          Add-Content $env:GITHUB_ENV "CODEX_BRIDGE_VC_REDIST_ROOT=$vcRedistRoot"
          Write-Host "LIB=$targetLibraryPaths"
          Add-Content $env:GITHUB_ENV "LIB=$targetLibraryPaths"
          if (-not (Test-Path (Join-Path $vcpkgBin "sqlite3.dll"))) {
            throw "SQLite runtime is unavailable: $vcpkgBin\sqlite3.dll"
          }
          Add-Content $env:GITHUB_PATH $vcpkgBin
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/ci-cache/vcpkg
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Compile Windows application resources
        shell: pwsh
        run: |
          $resourceOutput = Join-Path $env:GITHUB_WORKSPACE ".build\windows-resources\CodexBridgeWindowsApp.res"
          & "$env:GITHUB_WORKSPACE\Scripts\compile-windows-resources.ps1" -OutputPath $resourceOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "CODEX_BRIDGE_WINDOWS_RESOURCE=$resourceOutput"
      - name: Restore SwiftPM dependency repositories
        id: swift-dependencies-cache
        uses: actions/cache/restore@v6
        with:
          path: Packages/BridgeCore/.build/repositories
          key: windows-swift-repositories-v1-${{ hashFiles('Packages/BridgeCore/Package.resolved', 'Vendor/swift-sdk/Package.resolved') }}
          restore-keys: windows-swift-repositories-v1-
      - name: Resolve SwiftPM dependencies
        shell: pwsh
        run: |
          swift package --package-path Packages/BridgeCore resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save SwiftPM dependency repositories
        if: steps.swift-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Packages/BridgeCore/.build/repositories
          key: ${{ steps.swift-dependencies-cache.outputs.cache-primary-key }}
      - name: Build service and Windows shell
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targetTriple = $env:TARGET_TRIPLE
          . "$env:GITHUB_WORKSPACE\Scripts\windows-swift-arguments.ps1"
          $swiftArguments = @(Get-WindowsSwiftArguments `
            -VcpkgInstalledRoot "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.architecture }}-windows" `
            -TargetTriple $targetTriple -LibraryPaths ($env:TARGET_LIBRARY_PATHS -split ";"))
          $buildArguments = @($swiftArguments) + @("-c", "release")
          swift build @buildArguments --product codex-bridge-windows-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build @buildArguments --product codex-bridge-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binPathOutput = & swift build @buildArguments --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binPath = ($binPathOutput | Select-Object -Last 1).ToString().Trim()
          if (-not $binPath) { throw "Swift build output directory was empty." }
          Add-Content $env:GITHUB_ENV "SWIFT_BIN_PATH=$binPath"
      - name: Run package test suite
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          $targetTriple = $env:TARGET_TRIPLE
          . "$env:GITHUB_WORKSPACE\Scripts\windows-swift-arguments.ps1"
          $swiftArguments = @(Get-WindowsSwiftArguments `
            -VcpkgInstalledRoot "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.architecture }}-windows" `
            -TargetTriple $targetTriple -LibraryPaths ($env:TARGET_LIBRARY_PATHS -split ";"))
          $testArguments = @($swiftArguments) + @("-c", "release")
          swift test @testArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify installed Agent CLI contracts
        shell: pwsh
        timeout-minutes: 10
        run: |
          node Scripts/verify-agent-runtime-resources.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node Scripts/verify-agent-runtime-resources.mjs "$env:SWIFT_BIN_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix .build/agent-contract --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 @qodercn-ai/qoderclicn@1.1.64 @qodercn-ai/qodercn-agent-sdk@1.0.50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import { spawn, execFileSync } from 'node:child_process';
          import { readFile, mkdir } from 'node:fs/promises';
          import { createInterface } from 'node:readline';
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          import { SDKProcessOwner } from '../../Packages/BridgeCore/Sources/BridgeQoderSDK/Resources/QoderHost/process.mjs';
          const root = path.resolve('.build/agent-contract');
          const modules = path.join(root, 'node_modules');
          const piRoot = path.join(modules, '@earendil-works/pi-coding-agent');
          const manifest = JSON.parse(await readFile(path.join(piRoot, 'package.json'), 'utf8'));
          const piEntry = path.join(piRoot, typeof manifest.bin === 'string' ? manifest.bin : manifest.bin.pi);
          const cli = path.join(modules, '@qodercn-ai/qoderclicn/bundle/qoderclicn.js');
          console.log('Pi CLI:', execFileSync(process.execPath, [piEntry, '--version'], { encoding: 'utf8' }).trim());
          console.log('Qoder CN CLI:', execFileSync(process.execPath, [cli, '--version'], { encoding: 'utf8' }).trim());
          const sessionDir = path.join(root, 'sessions');
          await mkdir(sessionDir, { recursive: true });
          const pi = spawn(process.execPath, [piEntry, '--mode', 'rpc', '--no-extensions', '--no-skills',
            '--no-prompt-templates', '--no-themes', '--session-dir', sessionDir], { stdio: ['pipe', 'pipe', 'pipe'] });
          pi.stderr.resume();
          const exited = new Promise(resolve => pi.once('exit', resolve));
          const lines = createInterface({ input: pi.stdout });
          const timer = setTimeout(() => pi.kill(), 30000);
          let stateSeen = false;
          try {
            pi.stdin.write(JSON.stringify({ id: 'state', type: 'get_state' }) + '\n');
            for await (const line of lines) {
              const value = JSON.parse(line);
              if (value.type === 'response' && value.id === 'state') {
                if (!value.success) throw new Error('Pi get_state failed');
                stateSeen = true; break;
              }
            }
          } finally { pi.stdin.end(); pi.kill(); await exited; clearTimeout(timer); lines.close(); }
          if (!stateSeen) throw new Error('Pi RPC state was not received');
          console.log('Pi native RPC handshake: passed');
          const sdk = await import(pathToFileURL(path.join(modules, '@qodercn-ai/qodercn-agent-sdk/dist/index.js')));
          const owner = new SDKProcessOwner();
          let authRequired = false;
          let warm;
          try {
            warm = await sdk.startup({ initializeTimeoutMs: 30000, options: {
              auth: sdk.qodercliAuth(), transport: sdk.ProcessTransport.default,
              executable: process.execPath, pathToQoderCLIExecutable: cli, cwd: root,
              settingSources: [], tools: [], persistSession: false,
              spawnQoderCLIProcess: options => owner.spawn(options),
              onAuthExpired: () => { authRequired = true; },
            } });
            console.log('Qoder CN native SDK initialization: passed');
          } catch (error) {
            if (!authRequired) throw new Error('Qoder SDK startup failed before authentication was verified');
            console.log('Qoder CN native SDK reached authentication; inference requires a signed-in account');
          } finally { if (warm) await warm.close(); await owner.close(); }
          '@ | Set-Content -LiteralPath .build/agent-contract/verify.mjs -Encoding utf8
          node .build/agent-contract/verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore Tunnel helper cache
        id: tunnel-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/tunnel-client/${{ matrix.architecture }}
          key: windows-tunnel-v1-${{ matrix.architecture }}-${{ hashFiles('Scripts/stage-windows-tunnel-client.ps1') }}
      - name: Stage Windows tunnel client
        shell: pwsh
        run: |
          $tunnelClientDir = Join-Path $env:GITHUB_WORKSPACE ".build\tunnel-client\${{ matrix.architecture }}"
          & "$env:GITHUB_WORKSPACE\Scripts\stage-windows-tunnel-client.ps1" `
            -Architecture "${{ matrix.architecture }}" `
            -Destination $tunnelClientDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Tunnel helper cache
        if: steps.tunnel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/tunnel-client/${{ matrix.architecture }}
          key: ${{ steps.tunnel-cache.outputs.cache-primary-key }}
      - name: Stage Windows portable package
        shell: pwsh
        run: |
          $targetTriple = $env:TARGET_TRIPLE
          $portableDir = Join-Path $env:GITHUB_WORKSPACE ".build\windows-dist\${{ matrix.architecture }}"
          # The helper directory is derived here instead of being forwarded
          # through GITHUB_ENV, so a package can never be staged without it.
          $tunnelClientDir = Join-Path $env:GITHUB_WORKSPACE ".build\tunnel-client\${{ matrix.architecture }}"
          foreach ($required in @("tunnel-client.exe", "tunnel-client.sha256")) {
            if (-not (Test-Path -LiteralPath (Join-Path $tunnelClientDir $required) -PathType Leaf)) {
              throw "Staged Tunnel helper is incomplete: $tunnelClientDir\$required"
            }
          }
          $stageArguments = @{
            BinPath = $env:SWIFT_BIN_PATH
            OutDir = $portableDir
            Architecture = "${{ matrix.architecture }}"
            VcpkgTriplet = "${{ matrix.architecture }}-windows"
            TunnelClientDir = $tunnelClientDir
          }
          if ($targetTriple) {
            $stageArguments["TargetTriple"] = $targetTriple
          }
          & "$env:GITHUB_WORKSPACE\Scripts\stage-windows-portable.ps1" @stageArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\install-inno-setup.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\build-windows-installer.ps1" `
            -Architecture "${{ matrix.architecture }}" `
            -PayloadDir "$env:GITHUB_WORKSPACE\.build\windows-dist\${{ matrix.architecture }}" `
            -OutputDir "$env:GITHUB_WORKSPACE\.build\windows-installer\${{ matrix.architecture }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          $installerRoot = "$env:GITHUB_WORKSPACE\.build\windows-installer\${{ matrix.architecture }}"
          $installers = @(Get-ChildItem -LiteralPath $installerRoot -Filter "*-Setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one EXE installer." }
          & "$env:GITHUB_WORKSPACE\.github\scripts\verify-windows-installer.ps1" `
            -InstallerPath $installers[0].FullName -Architecture "${{ matrix.architecture }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: codex-bridge-windows-${{ matrix.architecture }}
          path: .build/windows-dist/codex-bridge-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-bridge-windows-${{ matrix.architecture }}-installer
          path: |
            .build/windows-installer/${{ matrix.architecture }}/*-Setup.exe
            .build/windows-installer/${{ matrix.architecture }}/*-Setup.exe.sha256
            .build/windows-installer/${{ matrix.architecture }}/INSTALLER-BUILD-INFO.json
          if-no-files-found: error
